{% load mpc %}{% if page.paginator.num_pages > 1 %}
<nav class="d-print-none mt-2"><ul class="pagination pagination-sm justify-content-end mb-0">
{% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% qs page=page.previous_page_number %}">‹ Previous</a></li>{% endif %}
<li class="page-item disabled"><span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} rows</span></li>
{% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% qs page=page.next_page_number %}">Next ›</a></li>{% endif %}
</ul></nav>{% endif %}
