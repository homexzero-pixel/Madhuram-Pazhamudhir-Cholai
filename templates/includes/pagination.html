{% load cholai %}
{% if page.paginator.num_pages > 1 %}
<nav class="d-print-none"><ul class="pagination pagination-sm justify-content-end">
  {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% query_with page=page.previous_page_number %}">&laquo;</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>
  {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% query_with page=page.next_page_number %}">&raquo;</a></li>{% endif %}
</ul></nav>
{% endif %}
