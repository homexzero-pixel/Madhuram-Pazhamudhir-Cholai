{% extends "base.html" %}
{% block title %}{{ title }} · {{ block.super }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7 col-xl-6">
    <div class="card shadow-sm">
      <div class="card-header bg-white"><h5 class="mb-0">{{ title }}</h5></div>
      <div class="card-body">
        <form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %} novalidate>
          {% csrf_token %}
          {% include "includes/form_fields.html" %}
          <div class="d-flex gap-2">
            <button class="btn btn-success"><i class="bi bi-check2"></i> Save</button>
            <a href="{% url back %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
