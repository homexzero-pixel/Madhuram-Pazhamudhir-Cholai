{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>{{ title }}</h1>{% if subtitle %}<p>{{ subtitle }}</p>{% endif %}</div>{% if back %}<a href="{{ back }}" class="btn btn-outline-secondary">Back</a>{% endif %}</div>
<div class="card"><div class="card-body">
<form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %} novalidate>{% csrf_token %}
{% include "includes/form_fields.html" %}
<div class="mt-4 d-flex gap-2"><button class="btn btn-success btn-lg">{{ submit|default:"Save" }}</button>{% if back %}<a href="{{ back }}" class="btn btn-outline-secondary btn-lg">Cancel</a>{% endif %}</div>
</form></div></div>
{% endblock %}
