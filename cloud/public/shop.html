<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1fa64a">
<title>Order online</title>
<link rel="icon" href="/img/icon-192.png">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<link rel="stylesheet" href="/shop.css">
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <div class="top-row">
      <img src="/img/logo.webp" alt="" class="logo">
      <div class="where">
        <div class="mode" id="mode" role="tablist">
          <button data-m="delivery" role="tab">🛵 Delivery</button>
          <button data-m="pickup" role="tab">🛍️ Takeaway</button>
        </div>
        <div class="where-line" id="whereLine">…</div>
      </div>
      <a href="#orders" class="round" aria-label="My orders">🧾</a>
    </div>
    <label class="search" for="q">
      <span class="s-ico">🔍</span>
      <input id="q" type="search" placeholder="Search “tomato”, “அரிசி”, “milk”…" autocomplete="off">
      <button id="scanBtn" class="s-scan" type="button" aria-label="Scan a barcode">▦</button>
    </label>
  </header>
  <main id="view"><div class="loading">Loading…</div></main>
  <div id="cartbar" hidden>
    <span class="cb-left"><span class="cb-ico">🛒</span><span><b id="cbItems"></b><br><span id="cbTotal"></span></span></span>
    <a href="#cart" class="cb-go">View cart ›</a>
  </div>
  <nav class="bottom" id="bottom">
    <a href="#" data-nav="home"><span>🏠</span>Home</a>
    <a href="#cats" data-nav="cats"><span>🗂️</span>Categories</a>
    <button type="button" id="navScan" class="nav-scan" aria-label="Scan a barcode"><span>▦</span></button>
    <a href="#cart" data-nav="cart"><span>🛒<i id="navCount" hidden></i></span>Cart</a>
    <a href="#orders" data-nav="orders"><span>🧾</span>Orders</a>
  </nav>
</div>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-close></div><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast"></div>
<script src="/shop.js"></script>
</body>
</html>
