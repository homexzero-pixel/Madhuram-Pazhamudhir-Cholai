<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Order online</title>
<link rel="icon" href="/img/icon-192.png">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<link rel="stylesheet" href="/shop.css?v=2026.11.28a">
</head>
<body data-page="home">
<header class="pcbar" id="pcbar">
  <div class="pc-in">
    <a href="#" class="pc-brand"><img src="/img/logo.webp" alt=""><span id="pcName"></span></a>
    <label class="srch pc-srch"><i data-ico="search"></i>
      <input id="pcq" type="search" placeholder="Search for fruits, vegetables and groceries" autocomplete="off" enterkeyhint="search">
      <a href="#search" class="srch-f" aria-label="Sort and filter"><i data-ico="sliders"></i></a></label>
    <button type="button" class="pc-loc" id="pcLoc"></button>
    <a href="#orders" class="cbtn" aria-label="My orders"><i data-ico="bell"></i><b class="bdg" data-ordn hidden></b></a>
    <a href="#cart" class="cbtn" aria-label="Basket"><i data-ico="bag"></i><b class="bdg g" data-cartn hidden></b></a>
    <a href="#account" class="pc-acct" id="pcAcct"></a>
  </div>
</header>
<main id="view"><div class="loading">Loading…</div></main>
<a href="#cart" id="cartbar" hidden><span class="cb-l"><span id="cbLine"></span><i class="cb-prog"><u id="cbBar"></u></i></span>
  <span class="cb-r"><i data-ico="cart"></i>Cart<b id="cbN"></b></span></a>
<nav class="bnav" id="bnav">
  <a href="#" data-nav="home"><span class="bi"><i data-ico="home" class="i-off"></i><i data-ico="homeF" class="i-on"></i></span><span>Home</span></a>
  <a href="#cats" data-nav="cats"><span class="bi"><i data-ico="store"></i></span><span>Categories</span></a>
  <a href="#search" data-nav="search"><span class="bi"><i data-ico="search"></i></span><span>Search</span></a>
  <a href="#orders" data-nav="orders"><span class="bi"><i data-ico="activity"></i><i class="dot" data-orddot hidden></i></span><span>Orders</span></a>
  <a href="#account" data-nav="account"><span class="bi"><i data-ico="user"></i></span><span>Profile</span></a>
</nav>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-close></div><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast"></div>
<script src="/icons.js?v=2026.11.28a"></script>
<script src="/shop.js?v=2026.11.28a"></script>
</body>
</html>
